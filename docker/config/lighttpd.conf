server.modules = (
    "mod_access",
    "mod_alias",
    "mod_fastcgi",
    "mod_setenv",
    "mod_rewrite"
)

server.document-root = "/usr/share/readsb/html"
server.upload-dirs = ("/var/cache/lighttpd/uploads")
server.errorlog = "/var/log/lighttpd/error.log"
server.pid-file = "/var/run/lighttpd.pid"
server.username = "www-data"
server.groupname = "www-data"
server.port = 8080

index-file.names = ("index.html")

# MIME types
mimetype.assign = (
    ".html" => "text/html",
    ".txt" => "text/plain",
    ".jpg" => "image/jpeg",
    ".png" => "image/png",
    ".js" => "application/javascript",
    ".css" => "text/css",
    ".json" => "application/json",
    ".woff" => "application/font-woff",
    ".woff2" => "application/font-woff2"
)

# Directory listings
dir-listing.activate = "enable"

# Static file caching
$HTTP["url"] =~ "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$" {
    expire.url = ("" => "access plus 1 hours")
}

# Data endpoint for readsb
alias.url += (
    "/data/" => "/run/readsb/"
)

# Allow access to data directory
$HTTP["url"] =~ "^/data/" {
    dir-listing.activate = "enable"
}

# Custom error pages
server.error-handler-404 = "/404.html"

# Security headers
setenv.add-response-header = (
    "X-Frame-Options" => "SAMEORIGIN",
    "X-Content-Type-Options" => "nosniff",
    "X-XSS-Protection" => "1; mode=block"
)

# Compress output
$HTTP["url"] =~ "\.(js|css|html|json)$" {
    compress.filetype = ("text/plain", "text/html", "text/css", "application/javascript", "application/json")
}
